name: Code quality

on:
  push:
    branches: ['*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@5ed6a6b06b4d8e7c2b2d013eedbe86aeba01d5af
    with:
      php-version: '8.4'
      static-analysis: true
