name: Code quality

on:
  push:
    branches: ['*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@6fa3047f0fcb02c9b6f296d95944ffd473a8901c
    with:
      php-version: '8.4'
      static-analysis: true
