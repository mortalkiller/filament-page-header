name: Code quality

on:
  push:
    branches: ['*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@50aa14ee7a84caf7a0065a5937d5fd98c5298600
    with:
      php-version: '8.4'
      static-analysis: true
