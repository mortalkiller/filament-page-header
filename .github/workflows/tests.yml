name: Package tests
on:
  push:
    branches: ['1.x', '2.x', 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.0'
            filament: '^5.8.1'
          - php: '8.4'
            testbench: '^11.0'
            filament: '^5.8.1'
          - php: '8.3'
            testbench: '^10.0'
            filament: '5.8.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-lock
      - run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer require "filament/filament:${{ matrix.filament }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress > /tmp/composer.log 2>&1 || { cat /tmp/composer.log; exit 1; }
      - run: vendor/bin/pest --colors=never
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test tests/JavaScript/*.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress > /tmp/composer.log 2>&1 || { cat /tmp/composer.log; exit 1; }
      - run: |
          php bin/prepare-workbench.php
          php workbench/artisan package:discover
          php workbench/artisan filament:assets
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium > /tmp/playwright.log 2>&1 || { cat /tmp/playwright.log; exit 1; }
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
            workbench/storage/logs/
          retention-days: 7
