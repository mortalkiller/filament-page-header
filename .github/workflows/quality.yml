name: Code quality

on:
  push:
    branches: ['*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@830e5953c0a1244b4e7a772b6e728492bdd8ef9f
    with:
      php-version: '8.4'
      static-analysis: true
