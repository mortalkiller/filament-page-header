name: Initial branch formatting
on:
  push:
    branches: ['feature/schema-headers']
    paths: ['.github/workflows/format-initial.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'mortalkiller/filament-page-header' && github.ref == 'refs/heads/feature/schema-headers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress > /tmp/composer.log 2>&1 || { cat /tmp/composer.log; exit 1; }
      - name: Format tracked PHP files only
        run: |
          vendor/bin/pint
          git ls-files -z '*.php' | xargs -0 git add --
          if git diff --cached --quiet; then
            echo 'Tracked PHP files already match the formatter.'
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply Laravel Pint formatting'
          git push origin HEAD:feature/schema-headers
