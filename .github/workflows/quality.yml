name: Code quality

on:
  push:
    branches: ['*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@1cdc0e62d021fbef5ded991aced9e5a7e29e3277
    with:
      php-version: '8.4'
      static-analysis: true
