name: Code quality
on:
  push:
    branches: ['1.x', '2.x', 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress > /tmp/composer.log 2>&1 || { cat /tmp/composer.log; exit 1; }
      - run: composer format:check
      - name: Check tracked PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n 1 php -l
      - name: Check tracked JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n 1 node --check
