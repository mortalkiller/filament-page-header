name: Documentation

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-docs.yml@5a47fd17171530d4f969a9699d184725b7d32d44
    with:
      artifact-name: filament-page-header-docs
      deploy: false
