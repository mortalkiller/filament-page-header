name: Package standard

on:
  pull_request:
  push:
    branches: ['*.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-standard-check.yml@6fa3047f0fcb02c9b6f296d95944ffd473a8901c
    with:
      standard-ref: 830e5953c0a1244b4e7a772b6e728492bdd8ef9f
