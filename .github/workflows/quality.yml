name: Code quality

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@1.x
    with:
      php-version: '8.4'
      static-analysis: false
