name: Package tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-tests.yml@1.x
    with:
      matrix-json: >-
        {"include":[
          {"php":"8.3","testbench":"^10.0","filament":"4.12.6","expected_filament":"4.12.6"},
          {"php":"8.4","testbench":"^11.0","filament":"^4.12.6"},
          {"php":"8.5","testbench":"^11.0","filament":"^4.12.6"},
          {"php":"8.3","testbench":"^10.0","filament":"5.8.1","expected_filament":"5.8.1"},
          {"php":"8.4","testbench":"^11.0","filament":"^5.8.1"},
          {"php":"8.5","testbench":"^11.0","filament":"^5.8.1"}
        ]}
      test-command: composer test

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'

      - name: Run JavaScript tests
        run: node --test tests/JavaScript/*.test.mjs

  browser:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-browser-tests.yml@1.x
    with:
      filament-matrix-json: >-
        {"include":[{"filament":"4.12.6"},{"filament":"^5.8.1"}]}
      php-version: '8.4'
